name: Speech-first RU AI migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/speech-first-ru-ai-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 .github/scripts/migrate_speech_first_ru_ai.py
      - name: Verify diff
        run: git diff --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/pro/noodle/mobile/ui/player/RussianDubbingController.kt app/src/main/java/pro/noodle/mobile/ui/player/PlayerVideoSurface.kt
          git commit -m "feat(player): make RU AI speech-first autodubbing"
          git push origin HEAD:main
