name: One-time source tree migration

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/migrate-source-tree.yml"

permissions:
  contents: write

concurrency:
  group: noodlemobile-source-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo "cfe4385b17bb2763eb5947c955a311262c7dd9443a3e90c0a28397bc2a943cd2  NoodleMobile_0.10.0-alpha10_SOURCE.zip" | sha256sum -c -
          unzip -t NoodleMobile_0.10.0-alpha10_SOURCE.zip >/dev/null

      - name: Build effective source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration-work
          mkdir -p .migration-work
          unzip -q NoodleMobile_0.10.0-alpha10_SOURCE.zip -d .migration-work
          SRC=".migration-work/NoodleMobile_0.10.0-alpha10_SOURCE"
          test -f "$SRC/settings.gradle.kts"

          # Apply exactly the source overlays used by the last successful certified build.
          python3 ci/overlay.py "$SRC"
          python3 ci/runtime_hotfix.py "$SRC"
          python3 ci/multisource_hotfix2.py "$SRC"

          # Copy the actual Android project into the repository root.
          rm -rf app gradle tools docs
          cp -a "$SRC/app" ./
          cp -a "$SRC/gradle" ./
          cp -a "$SRC/tools" ./
          cp -a "$SRC/docs" ./
          cp -a "$SRC/build.gradle.kts" ./
          cp -a "$SRC/settings.gradle.kts" ./
          cp -a "$SRC/gradle.properties" ./
          cp -a "$SRC/gradlew" ./
          cp -a "$SRC/gradlew.bat" ./
          cp -a "$SRC/BUILDING_RU.md" ./
          cp -a "$SRC/PORTING_NOTES.md" ./
          cp -a "$SRC/desktop-spec-ADAPTER_SCHEMA_V3.md" ./
          cp -a "$SRC/desktop-spec-ENGINE_ARCHITECTURE.md" ./
          cp -a "$SRC/desktop-spec-SECURITY.md" ./
          cp -a "$SRC/desktop-spec-TESTING.md" ./

          chmod +x gradlew tools/*.sh

          # The repository now builds from root. Keep live probes useful with the new layout.
          if [[ -f ci/live_source_probe.py ]]; then
            sed -i 's#ROOT = Path(sys.argv\[1\] if len(sys.argv) > 1 else "work/NoodleMobile_0.10.0-alpha10_SOURCE")#ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else ".")#' ci/live_source_probe.py
          fi
          if [[ -f ci/deep_playback_probe.py ]]; then
            sed -i 's#ROOT = Path(sys.argv\[1\] if len(sys.argv) > 1 else "work/NoodleMobile_0.10.0-alpha10_SOURCE")#ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else ".")#' ci/deep_playback_probe.py
          fi

          # Remove the old archive/overlay storage model and stale generated reports.
          rm -f NoodleMobile_0.10.0-alpha10_SOURCE.zip
          rm -f ci/overlay.py ci/runtime_hotfix.py ci/multisource_hotfix2.py
          rm -f ALL_VERIFICATION.txt BOOTSTRAP_ATTEMPT.txt BUILD_ENVIRONMENT_CHECK.txt BUILD_PREFLIGHT.txt CONNECTED_CI_STATUS.txt
          rm -f BUILD_CERTIFICATION_STAGE9.md DEPENDENCY_BASELINE_STAGE9.md FIRST_TEST_APK_CERTIFICATION.md IMPLEMENTATION_REPORT_RU.md desktop-spec-STAGE9_SCHEMA_V3_REPAIR_REPORT_RU.md
          rm -rf .migration-work

      - name: Write direct-build CI and repository metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > .gitignore <<'GITIGNORE'
          .gradle/
          .idea/
          local.properties
          .toolchain/
          build-certification/
          **/build/
          *.apk
          *.aab
          *.apks
          *.jks
          *.keystore
          *.log
          .DS_Store
          GITIGNORE

          cat > .github/workflows/android-ci.yml <<'WORKFLOW'
          name: Noodle Mobile Android CI

          on:
            workflow_dispatch:
            push:
              branches: [ main ]
              paths:
                - "app/**"
                - "tools/**"
                - "gradle/**"
                - "*.gradle.kts"
                - "gradle.properties"
                - "settings.gradle.kts"
                - ".github/workflows/android-ci.yml"
            pull_request:

          permissions:
            contents: read

          jobs:
            build-certify:
              runs-on: ubuntu-latest
              timeout-minutes: 60
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v7

                - name: Set up JDK 21
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: "21"

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v4
                  with:
                    packages: platform-tools

                - name: Install Android Platform 37.0 and Build Tools 36.0.0
                  shell: bash
                  run: |
                    set -euo pipefail
                    sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
                    test -f "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
                    test -x "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"

                - name: Set up Gradle 9.5.1
                  uses: gradle/actions/setup-gradle@v6
                  with:
                    gradle-version: "9.5.1"
                    cache-read-only: ${{ github.event_name == 'pull_request' }}

                - name: Toolchain report
                  shell: bash
                  run: |
                    java -version
                    gradle --version
                    sdkmanager --version
                    "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2" version

                - name: Build and certify MultiSource Hotfix 2
                  shell: bash
                  run: |
                    chmod +x gradlew tools/*.sh
                    bash tools/ci-android-build.sh

                - name: Upload build diagnostics
                  if: always()
                  uses: actions/upload-artifact@v7
                  with:
                    name: noodle-alpha10-multisource-hotfix2-diagnostics
                    if-no-files-found: warn
                    retention-days: 14
                    path: |
                      build-certification/**
                      app/build/reports/**
                      app/build/outputs/logs/**
                      app/build/outputs/apk/debug/*.apk
                      app/build/outputs/apk/androidTest/**/*.apk

                - name: Upload certified APKs
                  if: success()
                  uses: actions/upload-artifact@v7
                  with:
                    name: NoodleMobile-0.10.0-alpha10-MultiSourceHotfix2-API37
                    if-no-files-found: error
                    retention-days: 30
                    path: |
                      app/build/outputs/apk/debug/*.apk
                      app/build/outputs/apk/androidTest/**/*.apk
                      build-certification/BUILD_RESULT.txt
                      build-certification/SHA256.txt
          WORKFLOW

          cat > README.md <<'README'
          # NoodleMobile

          **NoodleMobile** — нативное Android-приложение для многоисточникового поиска, разрешения и воспроизведения медиа через изолированные SNP-адаптеры и runtime-движки.

          ## Текущий baseline

          - Версия: `0.10.0-alpha10`
          - versionCode: `100010`
          - applicationId: `pro.noodle.mobile`
          - Фактическая линия: **MultiSource Hotfix 2**
          - minSdk: `28`
          - compileSdk / targetSdk: `37`
          - Android Platform: `37.0`
          - Build Tools: `36.0.0`
          - JDK: `21`
          - Java bytecode target: `17`
          - Gradle: `9.5.1`
          - Android Gradle Plugin: `9.3.1`
          - Kotlin: `2.4.10`
          - KSP: `2.3.11`
          - Compose BOM: `2026.06.00`
          - Media3: `1.10.1`
          - Room: `2.8.4`
          - DataStore: `1.2.1`
          - WorkManager: `2.11.2`
          - WebKit: `1.16.0`
          - SNP compatibility contract: `1.9.0`

          ## Репозиторий

          `main` содержит **обычное развёрнутое Android source tree**. Старый source ZIP и временные overlay-скрипты удалены; все сертифицированные исправления MultiSource Hotfix 2 интегрированы непосредственно в исходники.

          Основная структура:

          ```text
          app/                         Android application module
          gradle/                      Gradle wrapper metadata
          tools/                       build, verification and diagnostic tools
          docs/                        проектная документация
          ci/                          live compatibility probes
          .github/workflows/           GitHub Actions
          build.gradle.kts             root Gradle build
          settings.gradle.kts          Gradle settings
          gradle.properties            Gradle configuration
          ```

          ## Основные возможности

          - поиск одновременно по включённым SNP-источникам;
          - 15 runtime-движков и единый Resolver Pipeline;
          - HTML5, Video.js, HLS, DASH, JW Player, iframe-chain, JSON/API, WordPress REST, oEmbed, legacy/KVS engines;
          - безопасная нормализация URL и source-scoped host policy;
          - защищённый HTTP-клиент с Safe DNS, redirect validation и cookie isolation;
          - sandboxed WebView fallback;
          - Media3 playback, выбор качества, аудиодорожек и субтитров;
          - Picture-in-Picture и сохранение позиции просмотра;
          - progressive download и adaptive HLS/DASH offline;
          - Room + DataStore;
          - Favorites и Downloads;
          - Source Center, Source Health и Diagnostics;
          - импорт, обновление, rollback и repair SNP-адаптеров;
          - Marketplace, Trusted Keys и Adapter Studio;
          - manifest/integrity verification и защита ZIP import от traversal/duplicate paths.

          ## MultiSource Hotfix 2

          Актуальные исправления интегрированы прямо в source tree:

          - source-scoped CDN / migration hosts, подтверждённые live-probe;
          - KVS mixed-layout parsing для `/video/*` и `/videos/*`;
          - актуальный Video-laba search endpoint;
          - безопасные search endpoint fallback;
          - нормализация relative URL относительно final origin;
          - secure thumbnail loading через тот же SNP/Safe DNS policy;
          - thumbnail cache и реальные preview в карточках поиска;
          - улучшенная диагностика ошибок источников и blocked playback hosts;
          - реальные Android compiler/lint fixes;
          - Android `37.0` / `compileSdkMinor = 0`;
          - исправленные APK/androidTest APK certification scripts.

          ## Сборка и CI

          GitHub Actions собирает проект **непосредственно из файлов `main`**, без распаковки архива и без patch overlay:

          1. checkout;
          2. JDK 21;
          3. Android Platform `37.0` + Build Tools `36.0.0`;
          4. Gradle `9.5.1`;
          5. `:app:testDebugUnitTest`;
          6. `:app:lintDebug`;
          7. `:app:assembleDebug`;
          8. APK certification через `aapt2`;
          9. `:app:assembleDebugAndroidTest`;
          10. androidTest APK certification;
          11. instrumentation tests при наличии устройства/emulator.

          Последний baseline до развёртывания source tree успешно прошёл `Noodle Mobile Android CI` как `NoodleMobile-0.10.0-alpha10-MultiSourceHotfix2-API37`. После миграции тот же build/certification contract применяется уже к обычному исходному дереву.

          ## Безопасность

          - глобальный cleartext не включается;
          - разрешённые hosts изолированы по SNP-источникам;
          - redirects проходят повторную validation;
          - cookies разделены по источникам;
          - WebView permissions не выдаются автоматически;
          - TLS bypass не используется;
          - adapter packages проходят manifest/integrity и compatibility checks;
          - обновления поддерживают snapshot/rollback.

          ## Разработка

          Все дальнейшие изменения вносятся непосредственно в `app/`, `tools/` и остальные файлы `main`. Новые hotfix-и должны быть обычными source-коммитами, а не отдельными overlays поверх ZIP.
          README

          # Remove this one-time workflow from the migrated source tree.
          rm -f .github/workflows/migrate-source-tree.yml

      - name: Validate migrated tree before commit
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/java/pro/noodle/mobile/MainActivity.kt
          test -f app/src/test/java/pro/noodle/mobile/MultiSourceHotfix2Test.kt
          test -f tools/ci-android-build.sh
          test ! -e NoodleMobile_0.10.0-alpha10_SOURCE.zip
          test ! -e ci/overlay.py
          test ! -e ci/runtime_hotfix.py
          test ! -e ci/multisource_hotfix2.py
          grep -F 'compileSdkMinor = 0' app/build.gradle.kts
          grep -F 'Multi-source Hotfix 2' app/src/main/java/pro/noodle/mobile/core/version/BuildIdentity.kt
          grep -F 'fun loadThumbnail' app/src/main/java/pro/noodle/mobile/ui/search/SearchViewModel.kt
          grep -F 'video-laba.link' app/src/main/assets/adapters/bundled/video-laba.click/adapter.json
          python3 tools/verify-stage10.py
          git status --short

      - name: Commit migrated source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Flatten NoodleMobile source tree and remove source archive"
          git push origin HEAD:main
