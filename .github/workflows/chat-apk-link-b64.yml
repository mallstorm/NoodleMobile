name: Chat APK Encoded Link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chat-apk-link-b64.yml"

permissions:
  contents: read

jobs:
  encoded-link:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve and encode private release asset redirect
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: '625605701'
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS -D "$headers" -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          signed_url="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          test -n "$signed_url"
          printf '%s' "$signed_url" | base64 -w0 | sed 's/^/CHAT_APK_URL_B64=/'
          echo
