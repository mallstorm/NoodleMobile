name: Noodle Mobile Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "tools/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: write

jobs:
  build-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify repository source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -f tools/ci-android-build.sh
          test ! -e NoodleMobile_0.10.0-alpha10_SOURCE.zip
          test ! -e ci/overlay.py
          test ! -e ci/runtime_hotfix.py
          test ! -e ci/multisource_hotfix2.py
          grep -F 'compileSdkMinor = 0' app/build.gradle.kts
          grep -F 'Multi-source Hotfix 2' app/src/main/java/pro/noodle/mobile/core/version/BuildIdentity.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Platform 37.0 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          test -f "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Toolchain report
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --version
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2" version

      - name: Build and certify MultiSource Hotfix 2
        shell: bash
        run: |
          chmod +x gradlew tools/*.sh
          bash tools/ci-android-build.sh

      - name: Publish temporary APK release for chat transfer
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" NoodleMobile-gapless-debug.apk
          SHA256="$(sha256sum NoodleMobile-gapless-debug.apk | awk '{print $1}')"
          TAG="chat-apk-${GITHUB_RUN_ID}"
          gh release create "$TAG" NoodleMobile-gapless-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temporary NoodleMobile APK ${GITHUB_RUN_NUMBER}" \
            --notes "Temporary private transfer asset for commit ${GITHUB_SHA}."
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[] | select(.name=="NoodleMobile-gapless-debug.apk") | .id')"
          test -n "$ASSET_ID"
          LOCATION="$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location: /,""); print; exit}')"
          test -n "$LOCATION"
          echo "APK_SHA256=${SHA256}"
          echo "APK_URL_B64=$(printf '%s' "$LOCATION" | base64 -w0)"

      # Artifact quota exhaustion must not turn a successfully compiled/certified Android build red.
      # The failed upload remains visible on the step while the build result stays authoritative.
      - name: Upload build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: noodle-alpha10-multisource-hotfix2-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            build-certification/**
            app/build/reports/**
            app/build/outputs/logs/**
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/**/*.apk

      - name: Upload certified APKs
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: NoodleMobile-0.10.0-alpha10-MultiSourceHotfix2-API37
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/**/*.apk
            build-certification/BUILD_RESULT.txt
            build-certification/SHA256.txt
