name: Refine speech-first RU AI

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/refine-speech-first-ru-ai.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply speech-first refinement
        run: python3 .github/scripts/refine_speech_first_ru_ai.py

      - name: Verify no subtitle dubbing residue
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'DubbingSource|enableSubtitleMode|onCues\(|TRACK_TYPE_TEXT|processSubtitleCue' app/src/main/java/pro/noodle/mobile/ui/player/RussianDubbingController.kt
          grep -n 'const val CHUNK_MS = 20_000L' app/src/main/java/pro/noodle/mobile/ui/player/RussianDubbingController.kt
          grep -n 'CACHE_VERSION = "v2"' app/src/main/java/pro/noodle/mobile/ui/player/DubbingAudioCache.kt
          git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Platform 37 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Compile RU AI changes
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/pro/noodle/mobile/ui/player/RussianDubbingController.kt app/src/main/java/pro/noodle/mobile/ui/player/DubbingAudioCache.kt
          git commit -m "feat(player): refine speech-first RU AI autodubbing"
          git push origin HEAD:main
