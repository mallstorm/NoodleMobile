name: Chat APK Private Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chat-apk-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Build app APK
        run: |
          chmod +x gradlew
          gradle :app:assembleDebug --no-daemon
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publish private temporary release and signed URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          short="${GITHUB_SHA:0:12}"
          tag="chat-apk-$short"
          gh release delete "$tag" --repo "$repo" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$tag" "$apk#NoodleMobile-RU-AI.apk" \
            --repo "$repo" \
            --title "Temporary Chat APK $short" \
            --notes "Temporary private APK transfer for the current NoodleMobile source."
          asset_id="$(gh api "repos/$repo/releases/tags/$tag" --jq '.assets[] | select(.name == "NoodleMobile-RU-AI.apk") | .id' | head -n1)"
          test -n "$asset_id"
          headers="$(mktemp)"
          curl -sS -D "$headers" -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$repo/releases/assets/$asset_id"
          signed_url="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          test -n "$signed_url"
          echo "CHAT_APK_TAG=$tag"
          echo "CHAT_APK_ASSET_ID=$asset_id"
          echo "CHAT_APK_SIGNED_URL=$signed_url"
