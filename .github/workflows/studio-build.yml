name: SNP Studio build + live probe

on:
  workflow_dispatch:
  push:
    branches: [ "feature/snp-studio-auto" ]

permissions:
  contents: write

concurrency:
  group: studio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Platform 37.0 and Build Tools 36.0.0
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build and certify
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew tools/*.sh
          bash tools/ci-android-build.sh

      - name: Live probe of bundled SNP and Studio auto-builder
        continue-on-error: true
        env:
          NOODLE_LIVE_STUDIO: "1"
          NOODLE_LIVE_OUT: ${{ github.workspace }}/build-certification/live-studio
          NOODLE_LIVE_QUERY: ${{ vars.NOODLE_LIVE_QUERY || 'aziatki' }}
          NOODLE_LIVE_SITES: ${{ vars.NOODLE_LIVE_SITES || 'm.porno-666.me' }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'pro.noodle.mobile.LiveStudioProbeTest' -i 2>&1 | tail -400 > build-certification/live-probe-gradle.log || true

      - name: Publish results to ci-out branch
        if: always()
        run: |
          set -e
          OUT=$(mktemp -d)
          mkdir -p "$OUT/run"
          cp -r build-certification/. "$OUT/run/" 2>/dev/null || true
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            mkdir -p "$OUT/run/apk"
            sha256sum "$APK" | awk '{print $1}' > "$OUT/run/apk/SHA256.txt"
            split -b 45m -d -a 2 "$APK" "$OUT/run/apk/NoodleMobile-debug.apk.part-"
          fi
          find app/build/test-results -name '*.xml' -exec cp {} "$OUT/run/" \; 2>/dev/null || true
          find app/build/reports/lint-results* -maxdepth 0 -exec cp -r {} "$OUT/run/" \; 2>/dev/null || true
          echo "sha=${GITHUB_SHA} build=${{ steps.build.outcome }} run=${GITHUB_RUN_ID}" > "$OUT/run/STATUS.txt"
          cd "$OUT"
          git init -q -b ci-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci-out for ${GITHUB_SHA} (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-out
