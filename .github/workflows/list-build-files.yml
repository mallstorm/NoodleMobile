name: List NTL build files

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/list-build-files.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write build snapshot file list
        shell: bash
        run: |
          set -euo pipefail
          xz -dc mirror/export/NoodleMobile-build.tar.xz | tar -tf - > mirror/BUILD_FILELIST.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror/BUILD_FILELIST.txt
          git commit -m "ci: list files in NTL build snapshot" || true
          git push origin HEAD:main
