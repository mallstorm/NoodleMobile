name: Export NTL mirror bundle

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/export-ntl-mirror.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Pack tracked source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mirror/export
          mkdir -p mirror/export
          git archive --format=tar.gz --output=mirror/export/NoodleMobile-source.tar.gz HEAD \
            ':(exclude).github/workflows/export-ntl-mirror.yml' \
            ':(exclude)mirror/**'
          printf '%s\n' "$(git rev-parse HEAD)" > mirror/export/SOURCE_SHA.txt
          sha256sum mirror/export/NoodleMobile-source.tar.gz > mirror/export/SOURCE_ARCHIVE_SHA256.txt
          ls -lh mirror/export

      - name: Commit mirror bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mirror/export
          if git diff --cached --quiet; then
            echo "Mirror bundle unchanged"
            exit 0
          fi
          git commit -m "ci: publish NoodleMobile source bundle for ntl mirror"
          git push origin HEAD:main
