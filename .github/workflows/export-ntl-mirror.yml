name: Export NTL mirror bundle

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/export-ntl-mirror.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Pack lean Android build snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mirror/export mirror/chunks
          mkdir -p mirror/export mirror/chunks
          git archive --format=tar HEAD \
            app build.gradle.kts settings.gradle.kts gradle.properties \
            ':(exclude)app/src/main/assets/adapters/bundled/*/_search.html' \
            ':(exclude)app/src/main/assets/adapters/bundled/*/_view.html' \
            ':(exclude)app/src/main/assets/adapters/bundled/*/analysis.txt' \
            ':(exclude)app/src/main/assets/adapters/bundled/*/snippets.pas' \
            | xz -9e -T0 > mirror/export/NoodleMobile-build.tar.xz
          base64 -w 0 mirror/export/NoodleMobile-build.tar.xz > /tmp/NoodleMobile-build.tar.xz.b64
          split -b 6000 -d -a 3 /tmp/NoodleMobile-build.tar.xz.b64 mirror/chunks/part-
          printf '%s\n' "$(git rev-parse HEAD)" > mirror/export/SOURCE_SHA.txt
          sha256sum mirror/export/NoodleMobile-build.tar.xz > mirror/export/SOURCE_ARCHIVE_SHA256.txt
          wc -c mirror/export/NoodleMobile-build.tar.xz
          ls -lh mirror/chunks

      - name: Commit mirror bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mirror
          if git diff --cached --quiet; then
            echo "Mirror bundle unchanged"
            exit 0
          fi
          git commit -m "ci: refresh lean NoodleMobile build mirror"
          git push origin HEAD:main
