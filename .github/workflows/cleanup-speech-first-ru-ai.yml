name: Cleanup speech-first RU AI

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/cleanup-speech-first-ru-ai.yml"
      - ".github/scripts/cleanup_speech_first_ru_ai.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove legacy subtitle dubbing branch
        run: python3 .github/scripts/cleanup_speech_first_ru_ai.py
      - name: Verify diff
        run: git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/pro/noodle/mobile/ui/player/RussianDubbingController.kt
          git commit -m "refactor(player): remove subtitle-based RU dubbing path"
          git push origin HEAD:main
