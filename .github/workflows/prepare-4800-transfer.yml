name: Prepare 4800 transfer parts

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/prepare-4800-transfer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare matching buildparts
        shell: bash
        run: |
          set -euo pipefail
          test -f mirror/export/NoodleMobile-build.tar.xz
          rm -rf mirror/buildparts
          mkdir -p mirror/buildparts
          base64 -w 0 mirror/export/NoodleMobile-build.tar.xz > /tmp/payload.b64
          split -b 4800 -d -a 3 /tmp/payload.b64 /tmp/part-
          for f in /tmp/part-*; do
            n="$(basename "$f")"
            fold -w 60 "$f" > "mirror/buildparts/${n}.b64"
          done
          printf '%s\n' "$(ls mirror/buildparts/part-*.b64 | wc -l)" > mirror/buildparts/PART_COUNT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror/buildparts
          git commit -m "ci: prepare 4800-char NTL buildparts" || true
          git push origin HEAD:main
