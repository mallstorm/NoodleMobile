name: Prepare plain patch transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/prepare-plain-patch-transfer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build plain-text patch parts from product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mirror/patchparts /tmp/noodle-product
          mkdir -p mirror/patchparts /tmp/noodle-product
          git archive 6a7e97d5a6286ca65366e4d46e0bfcf6d54a41be \
            app build.gradle.kts settings.gradle.kts gradle.properties \
            ':(exclude)app/src/main/assets/adapters/bundled/*/_search.html' \
            ':(exclude)app/src/main/assets/adapters/bundled/*/_view.html' \
            ':(exclude)app/src/main/assets/adapters/bundled/*/analysis.txt' \
            ':(exclude)app/src/main/assets/adapters/bundled/*/snippets.pas' \
            | tar -x -C /tmp/noodle-product
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('/tmp/noodle-product')
          out = Path('mirror/patchparts')
          sections = []
          manifest = []
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel = p.relative_to(root).as_posix()
              data = p.read_text(encoding='utf-8')
              lines = data.splitlines(keepends=True)
              n = len(lines)
              header = [
                  f'diff --git a/{rel} b/{rel}\n',
                  'new file mode 100644\n',
                  '--- /dev/null\n',
                  f'+++ b/{rel}\n',
                  f'@@ -0,0 +1,{n} @@\n' if n else '@@ -0,0 +1,0 @@\n',
              ]
              body = [('+' + line) if line.endswith('\n') else ('+' + line + '\n') for line in lines]
              sections.append(''.join(header + body))
              manifest.append(f'{rel}\t{len(data.encode())}\t{hashlib.sha256(data.encode()).hexdigest()}')

          limit = 18000
          parts, cur = [], ''
          for sec in sections:
              if cur and len((cur + sec).encode()) > limit:
                  parts.append(cur); cur = ''
              cur += sec
          if cur: parts.append(cur)
          for i, part in enumerate(parts):
              (out / f'part-{i:03d}.patch').write_text(part, encoding='utf-8')
          (out / 'MANIFEST.tsv').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          (out / 'PART_COUNT.txt').write_text(str(len(parts)) + '\n', encoding='utf-8')
          print(f'files={len(manifest)} parts={len(parts)}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror/patchparts
          git commit -m "ci: prepare plain-text product patch transfer" || true
          git push origin HEAD:main
