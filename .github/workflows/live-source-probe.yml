name: Noodle Live Source Probe

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/src/main/assets/adapters/bundled/**"
      - "ci/live_source_probe.py"
      - "ci/deep_playback_probe.py"
      - ".github/workflows/live-source-probe.yml"

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify direct source layout
        shell: bash
        run: |
          set -euo pipefail
          test -d app/src/main/assets/adapters/bundled
          test -f ci/live_source_probe.py
          test -f ci/deep_playback_probe.py
          test ! -e NoodleMobile_0.10.0-alpha10_SOURCE.zip

      - name: Probe bundled sources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-certification
          python3 ci/live_source_probe.py . build-certification/LIVE_SOURCE_PROBE.json | tee build-certification/LIVE_SOURCE_PROBE.log
          python3 ci/deep_playback_probe.py . build-certification/DEEP_PLAYBACK_PROBE.json | tee build-certification/DEEP_PLAYBACK_PROBE.log

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noodle-live-source-probe
          retention-days: 7
          if-no-files-found: warn
          path: |
            build-certification/LIVE_SOURCE_PROBE.json
            build-certification/LIVE_SOURCE_PROBE.log
            build-certification/DEEP_PLAYBACK_PROBE.json
            build-certification/DEEP_PLAYBACK_PROBE.log
