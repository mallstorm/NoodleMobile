name: Export full NTL transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/export-full-ntl.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pack complete repository tree
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          rm -rf transfer/full transfer/fullparts
          mkdir -p transfer/full
          git archive --format=tar HEAD -- . ':(exclude)transfer/**' | xz -9e -T0 > transfer/full/NoodleMobile-full.tar.xz
          sha256sum transfer/full/NoodleMobile-full.tar.xz | awk '{print $1}' > transfer/full/ARCHIVE_SHA256.txt
          printf '%s\n' "$SOURCE_SHA" > transfer/full/SOURCE_SHA.txt
          wc -c transfer/full/NoodleMobile-full.tar.xz | awk '{print $1}' > transfer/full/ARCHIVE_SIZE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A transfer
          git commit -m "ci: export full NTL binary bundle" || true
          git push origin HEAD:main
